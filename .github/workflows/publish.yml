name: Publish to PyPI

on:
  push:
    tags: ["v*"]

# Least privilege: the build job only needs to read the repo. The publish job
# overrides this with id-token: write (for PyPI Trusted Publishing) and does not
# check out the repo, so it needs no contents access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # The tag name is a LABEL; the version actually published comes from the tagged commit's
      # pyproject.toml, and nothing else compared the two. So a tag on the wrong commit uploads a
      # different version than its name claims -- silently, and PyPI uploads are IRREVERSIBLE, so
      # the only recovery is burning another version number. Compare against the BUILT artifact
      # rather than pyproject, because the artifact is what gets uploaded. Runs in `build`, so a
      # mismatch fails before the `publish` job (which `needs: build`) can run.
      - name: Tag must match the built version
        run: |
          python - "$GITHUB_REF_NAME" <<'PY'
          import pathlib, sys
          from packaging.version import InvalidVersion, Version

          tag = sys.argv[1]
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"::error::expected exactly one wheel in dist/, found {[w.name for w in wheels]}")
          # PEP 427: {distribution}-{version}-{python tag}-{abi tag}-{platform tag}.whl
          built = wheels[0].name.split("-")[1]
          try:
              # Compare PARSED versions: the wheel name is PEP 440-normalized while a tag is typed
              # by hand, so a string compare would fail on a cosmetic difference and pass on none.
              ok = Version(tag.removeprefix("v")) == Version(built)
          except InvalidVersion as exc:
              sys.exit(f"::error::cannot parse tag {tag!r} or built version {built!r}: {exc}")
          if not ok:
              sys.exit(
                  f"::error::tag {tag} would publish version {built}. The tag is probably on the "
                  f"wrong commit -- publishing is irreversible, so this is refused."
              )
          print(f"tag {tag} matches built version {built}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          print-hash: true
