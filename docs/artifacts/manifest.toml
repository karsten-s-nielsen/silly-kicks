reason = "xCross features from frame positions"

[roots."silly_kicks/tracking/_ghost_gk_weights"]
classification = "frame_geometry"
reason = "ghost-GK regresses on frame positions"

[roots."silly_kicks/tracking/_ghost_outfield_weights"]
classification = "frame_geometry"
reason = "ghost-outfield regresses on frame positions"

[roots."silly_kicks/tracking/_receiver_weights"]
classification = "frame_geometry"
reason = "receiver model reads pre-pass frame positions"

[roots."silly_kicks/corners/_run_zone_weights"]
classification = "frame_geometry"
reason = "RunZoneModel GMMs on reflected frame positions"

[roots."silly_kicks/corners/_routine_weights"]
classification = "frame_geometry"
reason = "CornerRoutineModel NMF on frame-derived run vectors"

[roots."silly_kicks/expected_passing/weights"]
classification = "event_only"
reason = "PassCompletion: event-only action geometry"

[roots."silly_kicks/match_outcome/weights"]
classification = "event_only"
reason = "DependenceModel rho: event-only, no frames"

[roots."silly_kicks/win_probability/weights"]
classification = "event_only"
reason = "win-probability: event-only state, no frames"

[roots."silly_kicks/xsuccess/weights"]
classification = "event_only"
reason = "xSuccess: END-BLIND event-only action geometry"

[roots."silly_kicks/xtgk/_retention_weights"]
classification = "out"
reason = "xt-gk-v2 rho (item #4) -- deferred, v2 quarantined"

