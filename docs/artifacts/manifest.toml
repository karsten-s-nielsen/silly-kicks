# ADR-128 artifact manifest (spec 5.7). HUMAN-WRITTEN, with ONE exception (spec INV-9, 5.7 step 6): `adopt`
# sets the `training_commit` of each adopted artifact with a `commit_field` to the verified campaign commit. No tool
# writes any other field.
#
# Two field classes (INV-9):
#   * EXPECTATIONS (this file): declared before a run -- destination, job/variant/tier, certification,
#     dataset, corpus rule, training commit + where it is recorded, the re-fit event, and `expect` values.
#     A check compares an artifact AGAINST these; nothing here is derived from the artifact it checks.
#   * OBSERVED fields (sha256, metrics summary, env, campaign, adopted_at) live in observed.json, written
#     ONLY by `python -m scripts.hf_jobs campaign ... adopt`.
#
# Every value below was copied from the reviewed test constants it replaces (tests/test_bundled_weights_*,
# tests/tracking/test_position_only_bundled.py, tests/test_model_cards_match_bundles.py,
# scripts/validate_hub_variants.py, scripts/_hub_publish.py) and the committed metadata: a value no artifact
# carries is a defect (the corpus-policy test's own rule).

# ---- Re-fit events (cards render these; the version / ADR a card states comes from HERE) -----------------
[events.launch7]
version = "4.140.0"
adr = "ADR-128"
title = "HF Jobs launch-7 re-fit"
basis = "on the ADR-128 cycle1 campaign (launch 7)"
cite = "ADR-128, "

[roots."silly_kicks/tracking/_xshot_weights"]
classification = "frame_geometry"
reason = "xShot features from frame positions"

[roots."silly_kicks/tracking/_xcross_weights"]
classification = "frame_geometry"
reason = "xCross features from frame positions"

[roots."silly_kicks/tracking/_ghost_gk_weights"]
classification = "frame_geometry"
reason = "ghost-GK regresses on frame positions"

[roots."silly_kicks/tracking/_ghost_outfield_weights"]
classification = "frame_geometry"
reason = "ghost-outfield regresses on frame positions"

[roots."silly_kicks/tracking/_receiver_weights"]
classification = "frame_geometry"
reason = "receiver model reads pre-pass frame positions"

[roots."silly_kicks/corners/_run_zone_weights"]
classification = "frame_geometry"
reason = "RunZoneModel GMMs on reflected frame positions"

[roots."silly_kicks/corners/_routine_weights"]
classification = "frame_geometry"
reason = "CornerRoutineModel NMF on frame-derived run vectors"

[roots."silly_kicks/expected_passing/weights"]
classification = "event_only"
reason = "PassCompletion: event-only action geometry"

[roots."silly_kicks/match_outcome/weights"]
classification = "event_only"
reason = "DependenceModel rho: event-only, no frames"

[roots."silly_kicks/win_probability/weights"]
classification = "event_only"
reason = "win-probability: event-only state, no frames"

[roots."silly_kicks/xsuccess/weights"]
classification = "event_only"
reason = "xSuccess: END-BLIND event-only action geometry"

[roots."silly_kicks/xtgk/_retention_weights"]
classification = "out"
reason = "xt-gk-v2 rho (item #4) -- deferred, v2 quarantined"

