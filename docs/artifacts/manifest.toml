# ADR-128 artifact manifest (spec 5.7). HUMAN-WRITTEN, with ONE exception (spec INV-9, 5.7 step 6): `adopt`
# sets an adopted artifact's `training_commit` to the verified campaign commit. No tool writes any other field.
#
# Two field classes (INV-9):
#   * EXPECTATIONS (this file): declared before a run -- destination, job/variant/tier, certification,
#     dataset, corpus rule, training commit + where it is recorded, the re-fit event, and `expect` values.
#     A check compares an artifact AGAINST these; nothing here is derived from the artifact it checks.
#   * OBSERVED fields (sha256, metrics summary, env, campaign, adopted_at) live in observed.json, written
#     ONLY by `python -m scripts.hf_jobs campaign ... adopt`.
#
# Every value below was copied from the reviewed test constants it replaces (tests/test_bundled_weights_*,
# tests/tracking/test_position_only_bundled.py, tests/test_model_cards_match_bundles.py,
# scripts/validate_hub_variants.py, scripts/_hub_publish.py) and the committed metadata: a value no artifact
# carries is a defect (the corpus-policy test's own rule).

# ---- Re-fit events (cards render these; the version / ADR a card states comes from HERE) -----------------
[events.f1b]
version = "4.128.0"
adr = "ADR-106"
title = "F1b float32-frame re-fit"
basis = "on float32-stored frames"
cite = ""

[events.tf65]
version = "4.134.0"
adr = "ADR-120"
title = "TF-65 velocity-gap re-fit"
basis = "on the corrected floor velocities"
cite = "TF-65 / ADR-120, "

[events.adr126]
version = "4.138.0"
adr = "ADR-126"
title = "ADR-126 xShot type_id label re-fit"
basis = "on the corrected type_id shot label"
cite = "ADR-126, "

# Hub-only events (a Hub training_commit that matches no wheel event gets its own entry; values from
# CHANGELOG.md). [4.138.0]: "This cleared two defects: the ADR-126 xShot label defect, and the ADR-120
# floor-velocity staleness the owner-tier Hub artifacts had carried."
[events.hub_velocity]
version = "4.138.0"
adr = "ADR-120"
title = "ADR-120 floor-velocity Hub re-fit"
basis = "on the corrected floor velocities"
cite = "TF-65 / ADR-120, "

# [4.116.0]: the TF-61 xSuccess fit, trained on the full redistributable StatsBomb open-data corpus.
[events.tf61]
version = "4.116.0"
adr = "ADR-095"
title = "TF-61 xSuccess fit"
basis = "on the full redistributable StatsBomb open-data corpus"
cite = "TF-61 / ADR-095, "

