# ADR-130: the xShot/xCross refit on the stoppage-gated datasets (xshot115, xshot17, xcross_probe; schema
# tc3-frames-4). `verify` in refit mode passes each arm on its own acceptance gates and reports the comparison with
# the committed model. Launched by the Part Deux session's launch 9, beside cycle1.toml (owner ruling 2026-11-11).
#   .venv-hfjobs/Scripts/python -m scripts.hf_jobs campaign scripts/hf_jobs/campaigns/tf46_refit.toml <command>

[campaign]
name = "tf46_refit"
# ADR-130: new training data replaces the committed models on purpose.
mode = "refit"
bucket = "silly-kicks/hf-refit-scratch"
concurrency_cap = 8  # one job per instance at most
attempts = 3
# Resource-sharing overhaul (ADR-128 amendment 2026-11-03). Job-sizing (fix 1): few big jobs, not cap-many.
units_per_job = 20
max_shards = 12
# Launch pacing + backoff (fix 5); 16 launches per step (HFU spec 17.5).
launch_batch = 16
backoff_max_s = 300.0
# Mount-fault outage budget (fix 3): transient sidecar 401s per dataset before it is reported an outage.
mount_fault_budget = 12
# Per-dataset concurrent-mount cap (fix 2). This campaign mounts xshot115, xshot17 and xcross_probe, never tc3.
mount_cap = 25
# Preflight check 7 (HFU fit-units spec C3): the org's private storage (buckets + private datasets and models)
# must leave the headroom under the limit. The limit is 100 GB, owner-verified 2026-11-10 (the HF billing page).
# One campaign is about 7.5 GB: the headroom is two campaigns and 5 GB.
storage_limit_bytes = 100000000000
storage_headroom_bytes = 20000000000

[[jobs]]
job = "xshot_occurrence"
tier = "public"
dataset = "xshot17"
variants = ["default", "position_only"]
# ADR-132 / spec 5.5: the arms this job trains (the only arm xshot17 produces)
arms = ["public"]

[[jobs]]
job = "xshot_occurrence"
tier = "sc_extended"
dataset = "xshot115"
variants = ["default", "position_only"]
# ADR-132 / spec 5.5: the arms this job trains (today's ship_order[-1])
arms = ["sc_extended"]

[[jobs]]
job = "xcross_attempt"
tier = "public"
dataset = "xshot17"
probe_dataset = "xcross_probe"
variants = ["default", "position_only"]
# ADR-132 / spec 5.5: the arms this job trains (the only arm xshot17 produces)
arms = ["public"]

[[jobs]]
job = "xcross_attempt"
tier = "sc_extended"
dataset = "xshot115"
probe_dataset = "xcross_probe"
variants = ["default", "position_only"]
# ADR-132 / spec 5.5: the arms this job trains (today's ship_order[-1])
arms = ["sc_extended"]
