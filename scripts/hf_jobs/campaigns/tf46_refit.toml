# ADR-132: the ONE xShot/xCross refit on `xshot187` (SkillCorner 118 + IDSSE 7 + Gradient Sports 62; schema
# tc3-frames-4). The wheel jobs train both arms and ship the two-arm rule's choice; the Hub jobs train
# `sc_extended`. `verify` in refit mode (ADR-130) passes each arm on its own acceptance gates, the per-provider
# gates included, and reports the comparison with the committed model (owner rulings 2026-11-13; plan
# docs/superpowers/plans/2026-11-13-xshot187-refit-plan.md).
#   .venv-hfjobs/Scripts/python -m scripts.hf_jobs campaign scripts/hf_jobs/campaigns/tf46_refit.toml <command>

[campaign]
name = "tf46_refit"
# ADR-130: new training data replaces the committed models on purpose.
mode = "refit"
bucket = "silly-kicks/hf-refit-scratch"
# The in-flight ceiling, as cycle1.toml: each extract shards into ~10 jobs (units_per_job / max_shards), so 8 would
# run about one job per instance at a time; mount_cap below bounds the jobs that mount xshot187.
concurrency_cap = 25
attempts = 3
# Resource-sharing overhaul (ADR-128 amendment 2026-11-03). Job-sizing (fix 1): few big jobs, not cap-many.
units_per_job = 20
max_shards = 12
# Launch pacing + backoff (fix 5); 16 launches per step (HFU spec 17.5).
launch_batch = 16
backoff_max_s = 300.0
# Mount-fault outage budget (fix 3): transient sidecar 401s per dataset before it is reported an outage.
mount_fault_budget = 12
# Per-dataset concurrent-mount cap (fix 2). This campaign mounts xshot187 and xcross_probe, never tc3.
mount_cap = 25
# Preflight check 7 (HFU fit-units spec C3): the org's private storage (buckets + private datasets and models)
# must leave the headroom under the limit. The limit is 100 GB, owner-verified 2026-11-10 (the HF billing page).
# One campaign is about 7.5 GB: the headroom is two campaigns and 5 GB.
storage_limit_bytes = 100000000000
storage_headroom_bytes = 20000000000

[[jobs]]
job = "xshot_occurrence"
tier = "public"
dataset = "xshot187"
variants = ["default", "position_only"]
# ADR-132 item 6: the wheel job trains both arms and ships the two-arm rule's choice
arms = ["public", "sc_extended"]

[[jobs]]
job = "xshot_occurrence"
tier = "sc_extended"
dataset = "xshot187"
variants = ["default", "position_only"]
# ADR-132 item 6: the Hub job trains sc_extended (a one-arm job covers every staged unit)
arms = ["sc_extended"]

[[jobs]]
job = "xcross_attempt"
tier = "public"
dataset = "xshot187"
probe_dataset = "xcross_probe"
variants = ["default", "position_only"]
# ADR-132 item 6: the wheel job trains both arms and ships the two-arm rule's choice
arms = ["public", "sc_extended"]

[[jobs]]
job = "xcross_attempt"
tier = "sc_extended"
dataset = "xshot187"
probe_dataset = "xcross_probe"
variants = ["default", "position_only"]
# ADR-132 item 6: the Hub job trains sc_extended (a one-arm job covers every staged unit)
arms = ["sc_extended"]
