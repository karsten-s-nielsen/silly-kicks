[build-system]
# BOUNDED, not pinned. Every GitHub Action in .github/workflows/ is SHA-pinned while this was
# left unbounded, so the artifact's metadata version was a function of WALL-CLOCK TIME: hatchling
# 1.32.0 (2026-08-11 05:03Z) moved Metadata-Version 2.4 -> 2.5, and the v4.79.0 tag built 8 hours
# later became the first release the publisher's pinned validator refused. Measured, not inferred:
# 1.31.0 emits 2.4, 1.32.0 emits 2.5. The major bound cannot stop a repeat on its own -- the
# publish action's packaging pin is the other half -- but it makes the build reproducible and the
# blast radius of a backend release visible in a diff instead of in a failed publish.
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "silly-kicks"
version = "4.81.0"
description = "Classify and value on-ball football actions using SPADL and VAEP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Karsten S. Nielsen" },
]
keywords = ["soccer", "football", "analytics", "SPADL", "VAEP", "actions"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # pandas 3.0.4 segfaults (SIGSEGV) in its C `take_nd`/`maybe_promote` path when a
    # whole-DataFrame boolean mask carries a datetime64 column — reproduced deterministically
    # on py3.11+ (the sportec actions in spadl.orientation.detect_input_convention). 3.0.2/3.0.3
    # are clean; exclude ONLY the broken release so a fixed 3.0.5+ is adopted automatically.
    # Report upstream (pandas-dev/pandas). Bisected 2026-06-29.
    "pandas>=2.1.1,!=3.0.4",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.1",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
kloppy = ["kloppy>=3.18.0"]
numba = ["numba>=0.59.0"]
xarray = ["xarray>=2024.1.0"]
xgboost = ["xgboost>=2.0.0"]
catboost = ["catboost>=1.2"]
lightgbm = ["lightgbm>=4.0"]
# PR-S25 (3.2.0): test-only dep for the Bekkers golden-master parity test.
# CI installs this extra to exercise tests/tracking/test_pressure_bekkers_golden_master.py;
# the test skips if unravelsports is not installed. Pinned to Python>=3.11 because
# unravelsports>=1.2 itself requires Python 3.11+ -- silly-kicks targets >=3.10 so
# the golden-master extra is only installable on the wider 3.11+ subset.
golden-master = ["unravelsports>=1.2; python_version >= '3.11'"]
das = ["accessible-space>=2.0,<3"]
# PR-S95 (4.30.0, ADR-031 T3): the DFL/Sportec parse+shape port
# (silly_kicks/providers/sportec/). The port is pure stdlib xml.etree + pandas/numpy
# (already core deps), so this extra carries no new runtime requirement -- it is the
# opt-in import handle + the lakehouse's hard-dependency marker on adoption. Add deps
# here only if the port later needs one.
parse-dfl = []
ghost-gk = ["huggingface_hub>=0.20.0"]
ghost-gk-train = ["skl2onnx>=1.16.0"]
# TF-17 (PR-B): xCrossAttempt Hub weights download (from_hub). huggingface_hub is lazy-imported.
xcross = ["huggingface_hub>=0.20.0"]
# TF-16 (TF-19 PR-2): xShotOccurrence Hub weights download (from_hub) -- the sc_extended
# owner-tier variant is Hub-only. huggingface_hub is lazy-imported (mirrors [xcross]).
xshot = ["huggingface_hub>=0.20.0"]
# TF-24 (3.28.0): Optuna calibration harness (silly_kicks/calibration/). xgboost upper-bounded
# because the 1e-9 cache-equivalence gate rides on tree_method="hist" determinism, which a
# future major could change. ruthless-efficiency provides the Optuna optimisation substrate;
# the >=0.2.1 floor fixed a warm_start off-by-one (a fresh warm-started study ran n_trials-1
# trials) and that reason still holds. RAISED to >=0.4.0 because `ruthless.fingerprint` -- the
# structural, fail-closed digest `scripts/_driver.py` keys shard generations on -- became public
# in 0.4.0. The old floor permitted a resolve where `from ruthless import fingerprint` raises
# ImportError; uv.lock happened to resolve 0.4.0 and hid it.
calibration = [
    "ruthless-efficiency[optuna]>=0.4.0",
    "xgboost>=2.0,<4.0",
    # numba compiles the infer_ball_carrier + pitch-control kernels the Stage-1/Stage-2
    # objectives call once per trial. Without it those run as pure-Python loops — the
    # dominant cost of a full sweep. Declared here so calibration venvs get the fast path
    # by default (the TF-24 maintainer sweep ran without it and was needlessly slow).
    "numba>=0.59.0",
]
test = [
    "pytest>=7.4.2",
    "pytest-mock>=3.11.1",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    # pytables backs ``pd.HDFStore`` for the SB WorldCup-2018 fixture in tests/conftest.py.
    # Without it, the 5 ``test_predict*`` cases (vaep / xthreat / atomic vaep) error at
    # collection time with ImportError("Missing optional dependency 'pytables'").
    "tables>=3.9.0",
    # pyarrow backs pd.read_parquet / DataFrame.to_parquet for the IDSSE +
    # Metrica production-shape fixtures committed under tests/datasets/{idsse,metrica}/
    # (added in 1.10.0 for the cross-provider parity regression gate).
    "pyarrow>=14.0.0",
    # numba exercises the @njit pitch-control kernels in test_numba_parity.py.
    # Declared here (not just optional [numba]) so CI always validates parity.
    "numba>=0.59.0",
    # accessible-space exercises DAS invariants + shape-alignment tests.
    # Declared here (not just optional [das]) so CI always validates DAS adapter.
    "accessible-space>=2.0,<3",
    # huggingface_hub exercises Ghost-GK lazy download path in tests.
    "huggingface_hub>=0.20.0",
    # hypothesis powers the property-based no-ripple invariant test in
    # tests/tracking/test_cover_shadows.py (PR-S65). Declared here so CI always runs
    # the load-bearing property test instead of failing collection / skipping it.
    "hypothesis>=6.0",
    # TF-24 calibration harness deps so CI exercises ruthless[optuna] + xgboost (the
    # cache-equivalence + Optuna-smoke tests in tests/calibration/).
    "ruthless-efficiency[optuna]>=0.4.0",
    "xgboost>=2.0,<4.0",
    # pyyaml backs the CI-gating tripwire (tests/test_ci_slow_gating_wired.py), which parses
    # .github/workflows/ci.yml. Declared directly so the guard never rides a transitive edge
    # (previously available only via huggingface_hub -> pyyaml). See ADR-023.
    "pyyaml>=6.0",
]
# Generic trained-model HPO/training extra (ADR-011). Shared by future trainers
# (TF-16 xShotOccurrence + others) — same pins as [calibration]. Inference of a
# trained model gates on its own runtime extra (e.g. [xgboost]), NOT this one.
train = [
    "ruthless-efficiency[optuna]>=0.4.0",
    "xgboost>=2.0,<4.0",
    "pyarrow>=14.0.0",  # trainer caches the extracted feature matrix to parquet (per-match streaming)
    # TRAINING floor, deliberately tighter than the runtime `scikit-learn>=1.3.1` above. Inference
    # never imports sklearn (pure-numpy reconstruction), so consumers keep the permissive floor;
    # what needs constraining is the environment that FITS the trees, because HistGradientBoosting
    # produces different trees across versions. Measured on the ghost re-fit: the same corpus, the
    # same commit and the same pandas, fit under 1.7.2 and then 1.9.0, gave different weights
    # (1,096,295 vs 1,008,517 bytes, different sha256).
    #
    # The bundled ghost artifacts record `sklearn_version` and WARN on a runtime mismatch, so the
    # value was always treated as provenance-relevant -- but nothing constrained it at fit time, and
    # an unpinned DGX venv silently resolved 1.7.2 (the ceiling for the Python 3.10 that `uv`
    # happened to pick) against a superseded artifact fit under 1.9.0. A value worth warning about
    # is worth pinning. Pin what is actually used: the shipped weights are fit on 3.12 + 1.9.0.
    "scikit-learn>=1.9",
]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.409",
    "pandas-stubs>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/karsten-s-nielsen/silly-kicks"
Repository = "https://github.com/karsten-s-nielsen/silly-kicks"

[tool.hatch.build.targets.wheel]
packages = ["silly_kicks"]
# The "full" Ghost-GK weights are Hub-distributed (silly-kicks/ghost-gk-v1) and NOT committed to
# the repo (4.10.0) — downloaded from HuggingFace Hub on first use. This exclude is a defensive
# guard: if a maintainer trains a `full` model into that path locally, it stays out of the wheel.
# The "default" weights (~0.76 MB, parameters-only since v1.3.0 / silly-kicks 4.54.0) ship bundled.
exclude = ["silly_kicks/tracking/_ghost_gk_weights/full", "silly_kicks/tracking/_xcross_weights/full"]

[tool.hatch.build.targets.sdist]
# Same defensive exclude for the sdist. Each hatch target has its OWN include/exclude set,
# so the wheel exclude does not cover the sdist — the 4.10.0 publish initially failed because
# the sdist bundled the (then-committed) ~91 MB full/ weights and exceeded PyPI's 100 MB limit.
# The full/ dir is now removed from the repo; this keeps any locally-trained full/ out of the sdist.
exclude = ["silly_kicks/tracking/_ghost_gk_weights/full", "silly_kicks/tracking/_xcross_weights/full"]

# --- Ruff ---
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "N806", "S106", "S107", "N802", "N812", "S110"]
# ML convention: uppercase X, Y, Pscores, Pconcedes are standard in ML/stats code
"silly_kicks/vaep/**/*.py" = ["N803", "N806"]
# S608 (SQL injection): the probe + e2e-sweep helpers interpolate a
# fixed-literal provider name and lakehouse-derived match_id into queries
# against a read-only internal mart, not user input.
"scripts/probe_tracking_baselines.py" = ["S608"]
"scripts/probe_action_context_baselines.py" = ["S608"]
"scripts/build_lakehouse_ci_fixtures.py" = ["S608"]
"tests/test_tracking_real_data_sweep.py" = ["S608"]
"tests/tracking/test_action_context_real_data_sweep.py" = ["S608"]
# S310 (URL audit): the GS player-id e2e fetches from a FIXED https mock-provider API
# (deployed AWS endpoint) + the presigned S3 URL it returns; no user-controlled/file: scheme.
"tests/tracking/test_gradientsports_player_ids_e2e.py" = ["S310"]
"silly_kicks/atomic/vaep/**/*.py" = ["N803", "N806"]
"silly_kicks/xthreat/*.py" = ["N803", "N806", "E741"]
# xtgk mirrors xthreat's (l, w) grid-dimension convention (E741 ambiguous `l`).
"silly_kicks/xtgk/*.py" = ["N803", "N806", "E741"]
# Ghost-GK: ML-style uppercase X for feature matrices
"silly_kicks/tracking/_ghost_gk.py" = ["N803", "N806"]
# Ghost-GK scripts: ML-style uppercase X, Y
"scripts/train_ghost_gk.py" = ["N803", "N806"]
"scripts/measure_ghost_gk_estimators.py" = ["N803", "N806"]
"scripts/gen_ghost_gk_kde_golden.py" = ["N803", "N806"]
"scripts/profile_ac1_hotpaths.py" = ["N803", "N806"]
"scripts/validate_ghost_gk_refit.py" = ["N803", "N806"]
# False positive: ruff S105 flags string literals like "Free Kick" as "hardcoded passwords"
# because they're compared to variables named pass_type, shot_type, etc.
"silly_kicks/spadl/statsbomb.py" = ["S105"]
# S608 false positive: the SQL has only module-level constants interpolated
# (no user input). This is a build-time fixture extractor.
"scripts/extract_provider_fixtures.py" = ["S608"]
# TF-24 calibration: ML-style uppercase X/Y in the Stage-2 Brier objective.
"silly_kicks/calibration/_vaep_brier_objective.py" = ["N803", "N806"]
# TF-16 xShotOccurrence: ML-style uppercase X feature matrices in the HPO objective.
"silly_kicks/tracking/_xshot_occurrence_objective.py" = ["N803", "N806"]
# TF-17 xCrossAttempt: ML-style uppercase X feature matrices in the HPO objective.
"silly_kicks/tracking/_xcross_attempt_objective.py" = ["N803", "N806"]
# TF-17 xCrossAttempt: ML-style uppercase X feature matrices in the PR-B maintainer-eval module.
"silly_kicks/tracking/_xcross_eval.py" = ["N803", "N806"]
# TF-17 xCross PR-C causal port (public since TF-19/ADR-037): ML-style uppercase X/Y/Z in the matching estimators.
"silly_kicks/causal/**/*.py" = ["N803", "N806"]
# TF-19 sign-off power driver: same causal X/Z convention as the estimators it calls.
"scripts/run_signoff_power.py" = ["N803", "N806"]
# TF-17 xCross PR-C causal driver: ML-style uppercase X/Y/Z + `matching as M` (N812).
"scripts/validate_xcross_causal.py" = ["N803", "N806", "N812"]
# TF-19 shot-arm causal driver (thin clone of the xCross driver): same conventions.
"scripts/validate_xshot_causal.py" = ["N803", "N806", "N812"]
# TF-24 CLI prints a human-readable run summary (T201).
"scripts/calibrate_tracking_defaults.py" = ["T201"]
# TF-16 xS trainer: ML-style uppercase X + human-readable run summary (T201).
"scripts/train_xshot_occurrence.py" = ["N803", "N806", "T201"]
# TF-17 xCross trainer: ML-style uppercase X + human-readable run summary (T201).
"scripts/train_xcross_attempt.py" = ["N803", "N806", "T201"]
# xT-GK GK-distribution completion: ML-style uppercase X feature matrices (logistic model).
"silly_kicks/tracking/_gk_completion.py" = ["N803", "N806"]
# xT-GK completion trainer: ML-style uppercase X + human-readable run summary (T201).
"scripts/train_gk_completion.py" = ["N803", "N806", "T201"]
# xT-GK v2 retention (rho) trainer: ML-style uppercase X + human-readable run summary (T201).
"scripts/train_gk_retention.py" = ["N803", "N806", "T201"]
# NOTE (M5): NO blanket S608 for scripts/_loader_databricks.py — match_id is parameterized
# and provider is allowlist-validated; only the allowlisted table NAME carries a narrow
# inline `# noqa: S608` on its specific lines.

[tool.ruff.lint.isort]
known-first-party = ["silly_kicks"]

# --- Pyright ---
[tool.pyright]
include = ["silly_kicks", "tests", "scripts"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# tests import scripts-modules by bare name (sys.path insertion at runtime);
# mirror that for static resolution.
extraPaths = ["scripts"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
    "e2e: end-to-end tests requiring downloaded datasets",
    "slow: tests that take significant wall-clock time (e.g., model fits)",
]
# A NEW call site that silently serves the synthetic placeholder EPV surface must fail
# CI, not merely warn (ADR-041). The nine modules that legitimately exercise the
# synthetic path opt out at module level with an explicit reason; that opt-out list IS
# the inventory of synthetic-EPV call sites. Five of them are the auto-enumerating gates
# (purity / nan-safety / liveness / dup-action_id / id-dtype), which sweep every
# aggregator on defaults by design; the other four are the OBSO-family feature tests.
#
# A trained-model artifact carrying NO feature contract cannot be verified at all, so it must fail
# CI rather than warn (ADR-050). All three bundled artifacts are stamped, so this needs NO
# opt-outs: an opt-out appearing here later means an artifact shipped un-stamped, which is the
# thing to fix rather than annotate. The one legitimate exception would be a network-gated test
# reaching an HF-hosted variant, which cannot be re-uploaded under the standing owner hold.
# UnverifiableFeatureContractWarning is deliberately NOT escalated: a probe change must stay a
# warning, or extending the probe (which declaring a new constant REQUIRES) would brick every
# not-yet-re-saved artifact.
filterwarnings = [
    "error::silly_kicks.tracking.SyntheticEPVWarning",
    "error::silly_kicks.tracking.IgnoredSurfaceInputsWarning",
    "error::silly_kicks.tracking.MissingFeatureContractWarning",
]
